<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto" role="img" aria-labelledby="t d">
<title id="t">GitHub Actions to AWS pipeline</title><desc id="d">Pull requests run static checks and a read-only plan. Merges to main wait for approval in a protected environment, then apply with a separate role. A weekly job checks for drift. All jobs get short-lived AWS credentials through GitHub OIDC.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#232F3E;font-size:13px}.b{font-weight:bold}.c{text-anchor:middle}.s{font-size:11px;fill:#5a6472}.ln{stroke:#232F3E;stroke-width:1.8;fill:none;marker-end:url(#ar)}</style></defs>
<rect width="1200" height="560" fill="#fff"/>
<text x="20" y="34" style="font-size:22px;font-weight:bold">Terraform on AWS with GitHub Actions: no stored keys, approval before apply</text>
<text x="20" y="56" class="s" style="font-size:13px">Short-lived credentials through GitHub OIDC. Separate read-only plan and environment-scoped apply roles.</text>
<text x="20" y="80" class="b s" style="fill:#7d8998;letter-spacing:1px">PULL REQUEST</text>
<rect x="20" y="90" width="240" height="70" rx="8" fill="#fff" stroke="#232F3E" stroke-width="2"/>
<text x="140.0" y="121.0" class="c b">Developer opens a PR</text>
<text x="140.0" y="137.0" class="c s">one-line summary</text>
<path d="M260,125 L310,125" class="ln"/>
<rect x="310" y="90" width="240" height="70" rx="8" fill="#fff" stroke="#232F3E" stroke-width="2"/>
<text x="430.0" y="113.0" class="c b">Static checks</text>
<text x="430.0" y="129.0" class="c s">fmt · validate · TFLint</text>
<text x="430.0" y="145.0" class="c s">Checkov · Trivy</text>
<path d="M550,125 L600,125" class="ln"/>
<rect x="600" y="90" width="210" height="70" rx="8" fill="#fff" stroke="#232F3E" stroke-width="2"/>
<text x="705.0" y="113.0" class="c b">Plan job</text>
<text x="705.0" y="129.0" class="c s">read-only role</text>
<text x="705.0" y="145.0" class="c s">plan posted as PR comment</text>
<text x="20" y="230" class="b s" style="fill:#7d8998;letter-spacing:1px">MERGE TO MAIN</text>
<rect x="20" y="240" width="240" height="70" rx="8" fill="#fff" stroke="#232F3E" stroke-width="2"/>
<text x="140.0" y="271.0" class="c b">Merge to main</text>
<text x="140.0" y="287.0" class="c s">after review and green checks</text>
<path d="M260,275 L310,275" class="ln"/>
<rect x="310" y="240" width="240" height="70" rx="8" fill="#fff" stroke="#232F3E" stroke-width="2"/>
<text x="430.0" y="263.0" class="c b">Approval gate</text>
<text x="430.0" y="279.0" class="c s">environment "production"</text>
<text x="430.0" y="295.0" class="c s">required reviewers</text>
<path d="M550,275 L600,275" class="ln"/>
<rect x="600" y="240" width="210" height="70" rx="8" fill="#fff" stroke="#232F3E" stroke-width="2"/>
<text x="705.0" y="263.0" class="c b">Apply job</text>
<text x="705.0" y="279.0" class="c s">apply role, saved plan</text>
<text x="705.0" y="295.0" class="c s">one apply at a time</text>
<text x="20" y="380" class="b s" style="fill:#7d8998;letter-spacing:1px">WEEKLY SCHEDULE</text>
<rect x="20" y="390" width="240" height="70" rx="8" fill="#fff" stroke="#232F3E" stroke-width="2"/>
<text x="140.0" y="421.0" class="c b">Weekly schedule</text>
<text x="140.0" y="437.0" class="c s">Mondays 06:00 UTC</text>
<path d="M260,425 L310,425" class="ln"/>
<rect x="310" y="390" width="240" height="70" rx="8" fill="#fff" stroke="#232F3E" stroke-width="2"/>
<text x="430.0" y="413.0" class="c b">Drift check</text>
<text x="430.0" y="429.0" class="c s">plan -detailed-exitcode</text>
<text x="430.0" y="445.0" class="c s">read-only role</text>
<path d="M550,425 L600,425" class="ln"/>
<rect x="600" y="390" width="210" height="70" rx="8" fill="#fff" stroke="#232F3E" stroke-width="2"/>
<text x="705.0" y="413.0" class="c b">GitHub issue</text>
<text x="705.0" y="429.0" class="c s">opened or updated</text>
<text x="705.0" y="445.0" class="c s">if drift is found</text>
<rect x="860" y="70" width="320" height="440" rx="10" fill="#f6f7f9" stroke="#7d8998" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="876" y="92" class="b">AWS account</text>
<rect x="880" y="110" width="280" height="56" rx="8" fill="#fff" stroke="#8C4FFF" stroke-width="2"/>
<text x="1020.0" y="142.0" class="c b">GitHub OIDC provider</text>
<rect x="880" y="185" width="280" height="56" rx="8" fill="#fff" stroke="#DD344C" stroke-width="2"/>
<text x="1020.0" y="217.0" class="c b">Plan role (read-only)</text>
<rect x="880" y="260" width="280" height="56" rx="8" fill="#fff" stroke="#DD344C" stroke-width="2"/>
<text x="1020.0" y="292.0" class="c b">Apply role (environment only)</text>
<rect x="880" y="350" width="280" height="56" rx="8" fill="#fff" stroke="#7AA116" stroke-width="2"/>
<text x="1020.0" y="382.0" class="c b">S3 state bucket</text>
<rect x="880" y="425" width="280" height="56" rx="8" fill="#fff" stroke="#7AA116" stroke-width="2"/>
<text x="1020.0" y="457.0" class="c b">S3 sandbox bucket (demo)</text>
<path d="M810,125 L880,213" class="ln"/>
<path d="M810,275 L880,288" class="ln"/>
<path d="M1020,316 L1020,350" class="ln"/>
<text x="1030" y="336" class="s">writes only to sandbox-* and state</text>
<text x="830" y="175" class="s" style="text-anchor:end">OIDC token</text>
<text x="20" y="535" class="s">Every job exchanges a GitHub OIDC token for short-lived credentials. The apply role only trusts jobs running in the protected environment.</text>
</svg>