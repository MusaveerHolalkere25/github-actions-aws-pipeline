name: terraform-reusable

# Reusable workflow: plan (read-only role, comments on the PR) or apply (protected environment).
on:
  workflow_call:
    inputs:
      mode:
        description: "plan or apply"
        type: string
        required: true
      working_directory:
        type: string
        required: true
      aws_region:
        type: string
        required: true
      role_arn:
        description: "IAM role to assume through GitHub OIDC"
        type: string
        required: true
      state_bucket:
        type: string
        required: true
      state_key:
        type: string
        required: true
      environment:
        description: "GitHub environment for apply jobs (needs required reviewers)"
        type: string
        default: production
      terraform_version:
        type: string
        default: "~1.10"

jobs:
  plan:
    if: inputs.mode == 'plan'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ inputs.state_bucket }}" \
            -backend-config="key=${{ inputs.state_key }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="use_lockfile=true"

      - name: Plan
        run: |
          terraform plan -input=false -lock=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_FILE: ${{ inputs.working_directory }}/plan.txt
          WORKDIR: ${{ inputs.working_directory }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... truncated ...';
            const body = [
              `### Terraform plan: \`${process.env.WORKDIR}\``,
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  apply:
    if: inputs.mode == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ inputs.state_bucket }}" \
            -backend-config="key=${{ inputs.state_key }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="use_lockfile=true"

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply the saved plan
        run: terraform apply -input=false tfplan
